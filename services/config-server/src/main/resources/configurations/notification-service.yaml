spring:
  mongodb:
    username: username
    password: password
    host: localhost
    port: 27017
    database: notification
    authentication-database: admin
    auto-index-creation: true
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: paymentGroup,orderGroup
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringSerializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonSerilizer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: orderConfirmation:com.ahmedhassan.ecommerce.kafka.OrderConfirmationDto,paymentConfirmation:com.ahmedhassan.ecommerce.nofication.dto.PaymentNotificationRequestDto
  mail:
    host: localhost
    port: 1025
    username: username
    password: password
    properties:
      mail:
        smtp:
          trust: "*"
        auth: true
        starttls:
          enabled: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000
server:
  port: 8040