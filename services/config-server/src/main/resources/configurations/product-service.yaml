spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/product
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database: PostgreSQL
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "init"
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}